<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>공부별 · 초등 학습앱</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#F3F0FF;color:#2A2550}#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}#boot b{font-size:20px}#boot p{font-size:13px;color:#6B6591}
</style>
</head>
<body>
<div id="boot"><div><div style="font-size:44px">📚</div><b>공부별을 불러오는 중이에요</b><p>학년별 어휘 자료를 함께 준비하고 있어요.</p></div></div>
<script>
(function(){
  var stamp='20260904-vocab-mission-entry-v5';
  fetch('app_base.html?v='+stamp,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('app_base '+r.status);return r.text();})
    .then(function(html){
      var extra=''
        +'<script src="vocab_1_2.js?v='+stamp+'"><\/script>'
        +'<script src="vocab_4_1.js?v='+stamp+'"><\/script>'
        +'<script src="vocab_4_2.js?v='+stamp+'"><\/script>'
        +'<script src="vocab_grade_patch.js?v='+stamp+'"><\/script>'
        +'<script src="vocab_mission_repeat_patch.js?v='+stamp+'"><\/script>'
        +'<script src="vocab_mission_navigation_fix.js?v='+stamp+'"><\/script>'
        +'<script src="daily_mission_patch.js?v='+stamp+'"><\/script>';
      html=html.replace('</body>',extra+'</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      document.getElementById('boot').innerHTML='<div><div style="font-size:44px">⚠️</div><b>앱을 불러오지 못했어요.</b><p>'+String(err.message||err)+'</p></div>';
    });
})();
</script>
</body>
</html>
