<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>공부별 · 초등 학습앱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --purple:#7C5CFF; --star:#FFC93C; --coral:#FF7A85; --mint:#2FCDB4;
    --ink:#2A2550; --ink-soft:#6B6591; --bg:#F3F0FF; --card:#FFFFFF; --line:#ECE8FB;
    --kor:#FF7A85; --mat:#5AA9FF; --eng:#A98BFF; --soc:#FF9F45; --sci:#2FCDB4; --gold:#F2A93B;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Pretendard',system-ui,-apple-system,sans-serif;background:#DED8FA;color:var(--ink);display:flex;justify-content:center;}
  .jua{font-family:'Jua',sans-serif;letter-spacing:.2px;}
  #root{width:100%;max-width:440px;}
  .app{position:relative;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px;}
  .scroll::-webkit-scrollbar{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,rgba(243,240,255,0));}
  .hello{font-size:13px;color:var(--ink-soft);}
  .stat-pills{display:flex;gap:8px;align-items:center;}
  .pill{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(124,92,255,.12);}
  .pill .em{font-size:15px;}
  .snd{background:var(--card);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(124,92,255,.12);flex-shrink:0;}
  .wrap{padding:0 18px;}
  .card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(90,70,180,.08);}
  .section-t{font-size:16px;margin:22px 4px 12px;display:flex;align-items:center;gap:7px;}
  .ebs{display:inline-flex;align-items:center;gap:4px;background:#123C8C;color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.3px;}
  .hero{background:linear-gradient(135deg,#8A6BFF,#6C4AF0);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(108,74,240,.35);}
  .hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);}
  .hero .b1{width:120px;height:120px;right:-30px;top:-40px;} .hero .b2{width:80px;height:80px;right:40px;bottom:-40px;}
  .hero h2{font-size:20px;position:relative;margin-top:8px;} .hero p{font-size:13px;opacity:.92;margin-top:4px;position:relative;}
  .goalbar{height:12px;border-radius:999px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden;position:relative;}
  .goalbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFE08A,var(--star));transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .goalmeta{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;position:relative;opacity:.95;}
  .tree-card{display:flex;align-items:center;gap:16px;}
  .tree-pot{width:96px;height:96px;border-radius:24px;flex-shrink:0;background:linear-gradient(160deg,#EAFBF4,#D8F4EA);display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:inset 0 -8px 16px rgba(47,205,180,.18);}
  .streak-n{font-size:30px;color:var(--mint);line-height:1;}
  .mini{font-size:12.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .subj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .subj{border-radius:20px;padding:16px 10px;color:#fff;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(90,70,180,.16);transition:transform .12s;}
  .subj:active{transform:scale(.95);}
  .subj .ic{font-size:30px;} .subj .nm{font-size:14px;margin-top:6px;} .subj .pg{font-size:11px;opacity:.92;margin-top:3px;font-weight:600;}
  .subj .ring{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.12);right:-16px;top:-16px;}
  .subj.lock{opacity:.72;}
  .row{display:flex;align-items:center;gap:12px;padding:13px 4px;}
  .row+.row{border-top:1px solid var(--line);}
  .row .rc{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .row .rt{flex:1;} .row .rt b{font-size:14.5px;} .row .rt p{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .btn{display:block;width:100%;text-align:center;background:var(--purple);color:#fff;padding:15px;border-radius:16px;font-size:16px;box-shadow:0 8px 18px rgba(124,92,255,.35);transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--card);color:var(--purple);box-shadow:0 6px 16px rgba(124,92,255,.12);}
  .btn.mint{background:var(--mint);box-shadow:0 8px 18px rgba(47,205,180,.32);}
  .btn.gold{background:linear-gradient(135deg,#FFB43D,#F2882B);box-shadow:0 8px 18px rgba(242,136,43,.35);}
  .backb{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-soft);font-size:14px;padding:2px;}
  .subj-hero{border-radius:24px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 26px rgba(90,70,180,.22);}
  .subj-hero .ic{font-size:40px;}
  .semtabs{display:flex;gap:8px;margin-top:16px;}
  .semtab{flex:1;padding:12px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;font-size:14px;transition:all .12s;}
  .semtab.on{border-color:var(--purple);background:#F5F1FF;color:var(--purple);}
  .unititem{display:flex;align-items:center;gap:11px;padding:11px 2px;font-size:14px;font-weight:600;}
  .unititem+.unititem{border-top:1px solid var(--line);}
  .ucheck{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:800;}
  .ucheck.done{background:var(--mint);color:#fff;} .ucheck.todo{background:var(--line);color:var(--ink-soft);}
  .unititem.todo{color:var(--ink-soft);}
  .quiz-top{padding:16px 18px 6px;display:flex;align-items:center;gap:10px;}
  .qbar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden;}
  .qbar>i{display:block;height:100%;background:var(--purple);border-radius:999px;transition:width .4s;}
  .qx{font-size:22px;color:var(--ink-soft);}
  .qcard{margin:8px 18px;}
  .qtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#fff;padding:4px 10px;border-radius:999px;}
  .perfbadge{display:inline-block;background:linear-gradient(135deg,#FFB43D,#F2882B);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-left:6px;}
  .qunit{font-size:12px;font-weight:700;color:var(--ink-soft);margin:8px 0 0;}
  .qtext{font-size:20px;line-height:1.5;margin:8px 0 6px;font-family:'Jua';}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .choice{background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:15px 16px;font-size:16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s;width:100%;}
  .choice .kdot{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-soft);flex-shrink:0;font-family:'Jua';}
  .choice:active{transform:scale(.98);}
  .choice.correct{border-color:var(--mint);background:#EAFBF6;color:#12977f;}
  .choice.correct .kdot{background:var(--mint);color:#fff;}
  .choice.wrong{border-color:var(--coral);background:#FFF0F1;color:#d84a57;}
  .choice.wrong .kdot{background:var(--coral);color:#fff;}
  .choice.dim{opacity:.5;}
  .ox-cand{margin-top:20px;text-align:center;font-size:14px;color:var(--ink-soft);font-weight:700;}
  .ox-cand-a{margin-top:10px;background:var(--bg);border:2px dashed #CFC6F5;border-radius:16px;padding:18px 14px;font-size:21px;font-family:'Jua';color:var(--ink);line-height:1.4;}
  .ox-row{display:flex;gap:12px;margin-top:20px;}
  .ox-btn{flex:1;flex-direction:column!important;justify-content:center;align-items:center;text-align:center;padding:22px 10px;font-size:16px;gap:6px;}
  .ox-mark{font-size:34px;line-height:1;}
  .pathwrap{position:relative;height:210px;overflow:hidden;padding:0;border-radius:22px;}
  .pathstone{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:18px;color:#fff;border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 12px rgba(60,50,120,.3);cursor:pointer;}
  .pathstone:active{transform:translate(-50%,-50%) scale(.92);}
  .pathstone[disabled]{opacity:.9;cursor:default;}
  .pathstone.cur{width:52px;height:52px;font-size:20px;box-shadow:0 0 0 6px rgba(124,92,255,.22),0 8px 16px rgba(124,92,255,.45);}
  .pathwalker{position:absolute;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));animation:hop 1.4s infinite;}
  @keyframes hop{0%,100%{transform:translate(-50%,-50%) translateY(0);}50%{transform:translate(-50%,-50%) translateY(-7px);}}
  .pathflag{position:absolute;transform:translate(-50%,-100%);font-size:22px;pointer-events:none;}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav{width:32px;height:32px;border-radius:10px;background:var(--bg);font-size:18px;color:var(--purple);font-weight:800;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-h{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding:2px 0;}
  .cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:9px;background:var(--bg);color:var(--ink-soft);font-weight:600;}
  .cal-d.on{background:#FFF3CF;color:#C88A00;}
  .cal-d.full{background:linear-gradient(135deg,#FFD9EC,#E7D5FF);box-shadow:inset 0 0 0 2px #E86AA6;}
  .cal-d.today{outline:2px solid var(--purple);}
  button.cal-d{width:100%;font-family:inherit;cursor:pointer;}
  .cal-d.sel{outline:2px solid var(--star);background:#FFE9A8;}
  .gradepick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .gradepick{padding:12px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);font-family:'Jua';font-size:15px;color:var(--ink-soft);cursor:pointer;transition:all .12s;}
  .gradepick:active{transform:scale(.96);}
  .gradepick.on{border-color:var(--purple);background:#F5F1FF;color:var(--purple);}
  .ubtn{font-size:12px;font-weight:700;color:var(--purple);background:#F5F1FF;border-radius:10px;padding:7px 10px;margin-left:6px;flex-shrink:0;cursor:pointer;}
  .ubtn.cnc{color:#12977f;background:#EAFBF6;}
  .ubtn.vid{color:#d32f2f;background:#FDECEC;text-decoration:none;}
  .ubtn:active{transform:scale(.94);}
  .cnc-h{font-size:15px;color:var(--purple);margin:14px 0 6px;}
  .cnc-h:first-child{margin-top:0;}
  .cnc-b{font-size:14px;line-height:1.65;color:var(--ink);display:flex;gap:6px;margin:3px 0;}
  .cnc-dot{color:var(--mint);font-weight:800;}
  .atable{width:100%;border-collapse:collapse;font-size:13px;}
  .atable th{color:var(--ink-soft);font-weight:700;padding:8px 6px;text-align:left;border-bottom:2px solid var(--line);}
  .atable td{padding:9px 6px;border-top:1px solid var(--line);font-weight:600;}
  .atable td.num,.atable th.num{text-align:right;}
  .mbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;}
  .mbar>i{display:block;height:100%;border-radius:999px;transition:width .6s;}
  .vcard{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(90,70,180,.1);}
  .vtheme{text-align:center;font-weight:800;color:var(--purple);font-size:15px;margin-bottom:6px;}
  .vrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);}
  .vrow:first-of-type{border-top:none;}
  .vlabel{color:#fff;font-weight:800;font-size:12px;border-radius:10px;padding:7px 6px;width:58px;text-align:center;flex-shrink:0;}
  .vmain{flex:1;min-width:0;}
  .vword{font-size:24px;color:var(--ink);line-height:1.2;}
  .vhanja{font-size:15px;color:var(--ink-soft);}
  .vhanjabig{font-size:30px;letter-spacing:5px;}
  .vread{font-size:14px;color:var(--purple);font-weight:700;margin-top:3px;}
  .vdef{font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .vspk{width:46px;height:46px;border-radius:14px;background:#F5F1FF;font-size:20px;flex-shrink:0;cursor:pointer;}
  .vspk:active{transform:scale(.9);}
  .vnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;}
  .vnav .btn{width:auto;padding:12px 18px;}
  .gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .gal-cell{position:relative;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 4px 12px rgba(90,70,180,.1);}
  .gal-cell img{width:100%;display:block;}
  .gal-del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .gal-date{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:10px;padding:3px 7px;}
  .written-key{margin-top:10px;}
  .written-key .kw{display:inline-block;font-size:12px;font-weight:700;border-radius:9px;padding:4px 8px;margin:3px 4px 0 0;}
  .written-key .kw-on{background:#EAFBF6;color:#12977f;}
  .written-key .kw-off{background:var(--bg);color:var(--ink-soft);}
  .hof{margin-top:10px;display:inline-block;background:linear-gradient(135deg,#FFD9EC,#E7D5FF);color:#8a4a86;font-size:13px;font-weight:800;border-radius:12px;padding:6px 12px;}
  .feedback{margin:14px 18px;padding:16px;border-radius:18px;font-size:14px;line-height:1.6;}
  .feedback.ok{background:#EAFBF6;color:#12977f;} .feedback.no{background:#FFF0F1;color:#d84a57;}
  .feedback b{font-family:'Jua';font-size:15px;}
  .written-wrap{margin-top:16px;}
  .written-in{width:100%;border:2.5px solid var(--line);border-radius:16px;padding:14px 15px;font-family:inherit;font-size:16px;line-height:1.5;resize:none;outline:none;background:var(--card);}
  .wopt-guide{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
  .wopt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .wopt{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:15px;font-weight:600;color:var(--ink);}
  .wopt .kdot{width:24px;height:24px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);flex-shrink:0;font-family:'Jua';}
  .enlisten{display:inline-flex;align-items:center;gap:6px;margin:2px 0 14px;padding:9px 16px;border:2px solid var(--purple);background:#F5F1FF;color:var(--purple);border-radius:14px;font-weight:800;font-size:14px;font-family:'Jua';}
  .enlisten:active{transform:scale(.96);}
  .enbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px;}
  .enbar .enlisten{margin:0;}
  .enspeed-wrap{display:inline-flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px;}
  .enspeed{padding:7px 12px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--ink-soft);font-family:'Jua';background:transparent;}
  .enspeed.on{background:var(--purple);color:#fff;box-shadow:0 3px 8px rgba(124,92,255,.3);}
  .enspeed:active{transform:scale(.95);}
  .written-in:focus{border-color:var(--soc);}
  .written-mine,.written-ans{border-radius:16px;padding:12px 14px;font-size:15px;font-weight:600;line-height:1.5;}
  .written-mine{border:2.5px solid var(--line);background:var(--bg);}
  .written-mine.ok{border-color:var(--mint);background:#EAFBF6;color:#12977f;}
  .written-mine.no{border-color:var(--coral);background:#FFF0F1;color:#d84a57;}
  .written-ans{margin-top:10px;border:2.5px solid var(--soc);background:#F0F6FF;color:#2A62B0;}
  .wlbl{display:block;font-size:11px;font-weight:800;opacity:.7;margin-bottom:4px;letter-spacing:.3px;}
  .result{padding:40px 24px;text-align:center;}
  .result .big{font-size:64px;} .result h2{font-size:24px;margin-top:10px;line-height:1.35;} .result .score{font-size:15px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
  .reward{display:inline-flex;align-items:center;gap:8px;background:#FFF7E0;color:#C88A00;padding:10px 18px;border-radius:999px;font-weight:800;margin-top:18px;font-size:16px;}
  .chat{display:flex;flex-direction:column;height:100vh;}
  .chat-head{padding:14px 18px;display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:0 4px 14px rgba(90,70,180,.06);}
  .avatarStar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#FFD86B,#FF9F45);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 14px rgba(255,159,69,.35);}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .chat-body::-webkit-scrollbar{display:none;}
  .msg{max-width:82%;padding:12px 15px;border-radius:18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .msg.b{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:0 4px 12px rgba(90,70,180,.08);}
  .msg.u{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:6px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px;}
  .chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--purple);}
  .chat-input{display:flex;gap:8px;padding:12px 14px 16px;background:var(--card);align-items:flex-end;}
  .chat-input textarea{flex:1;border:2px solid var(--line);border-radius:16px;padding:11px 14px;font-family:inherit;font-size:14.5px;resize:none;max-height:96px;outline:none;background:var(--bg);}
  .chat-input textarea:focus{border-color:var(--purple);}
  .sendb{width:46px;height:46px;border-radius:14px;background:var(--purple);color:#fff;font-size:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .sendb:disabled{opacity:.4;}
  .typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-soft);margin:0 2px;animation:bl 1s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-4px);}}
  .rank-row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
  .rank-row+.rank-row{border-top:1px solid var(--line);}
  .rk{width:30px;font-family:'Jua';font-size:18px;text-align:center;color:var(--ink-soft);}
  .rk.top{color:var(--star);}
  .rface{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .rank-row.me{background:#F3F0FF;border-radius:16px;padding:12px;border:none!important;}
  .battle{background:linear-gradient(135deg,#FF9F45,#FF7A85);color:#fff;border-radius:24px;padding:20px;box-shadow:0 14px 28px rgba(255,122,133,.32);position:relative;overflow:hidden;}
  .avatar-stage{background:linear-gradient(160deg,#EDE7FF,#F7F3FF);border-radius:26px;padding:26px;text-align:center;position:relative;overflow:hidden;}
  .ava-big{font-size:78px;line-height:1;} .ava-hat{font-size:40px;margin-bottom:-14px;}
  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .shop-item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;transition:transform .1s;}
  .shop-item:active{transform:scale(.95);}
  .shop-item.on{border-color:var(--purple);background:#F5F1FF;}
  .shop-item .si{font-size:30px;}
  .shop-item .sp{font-size:11px;font-weight:700;color:var(--star);margin-top:4px;}
  .shop-item .owned{font-size:11px;font-weight:700;color:var(--mint);margin-top:4px;}
  .badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .badge{text-align:center;}
  .badge .bi{width:100%;aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--card);box-shadow:0 6px 14px rgba(90,70,180,.08);}
  .badge.locked .bi{filter:grayscale(1);opacity:.35;}
  .badge .bn{font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:600;}
  .report-bars{display:flex;flex-direction:column;gap:12px;}
  .rbar{display:flex;align-items:center;gap:10px;}
  .rbar .rl{width:42px;font-size:13px;font-weight:700;}
  .rbar .rt{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden;}
  .rbar .rt>i{display:block;height:100%;border-radius:999px;transition:width .8s;}
  .rbar .rv{width:38px;text-align:right;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--card);display:flex;justify-content:space-around;align-items:center;box-shadow:0 -6px 24px rgba(90,70,180,.1);border-radius:26px 26px 0 0;z-index:30;padding-bottom:6px;}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:10.5px;font-weight:700;width:60px;transition:color .15s;}
  .nav button .ni{font-size:22px;transition:transform .15s;}
  .nav button.on{color:var(--purple);} .nav button.on .ni{transform:translateY(-2px) scale(1.12);}
  .onb{padding:34px 26px;display:flex;flex-direction:column;min-height:100vh;}
  .onb .logo{font-size:60px;text-align:center;} .onb h1{font-size:30px;text-align:center;margin-top:6px;}
  .onb .sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-top:8px;line-height:1.6;}
  .field{margin-top:22px;} .field label{font-size:13px;font-weight:700;color:var(--ink-soft);margin-left:4px;}
  .field input{width:100%;margin-top:8px;padding:15px;border:2px solid var(--line);border-radius:16px;font-family:inherit;font-size:16px;outline:none;background:var(--card);}
  .field input:focus{border-color:var(--purple);}
  .grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
  .grade-b{padding:14px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;font-size:15px;transition:all .12s;}
  .grade-b.on{border-color:var(--purple);background:#F5F1FF;color:var(--purple);}
  .floatstar{position:fixed;pointer-events:none;font-size:26px;font-weight:800;color:var(--star);z-index:99;animation:fly 1s ease-out forwards;font-family:'Jua';}
  @keyframes fly{0%{opacity:0;transform:translateY(0) scale(.6);}20%{opacity:1;}100%{opacity:0;transform:translateY(-70px) scale(1.2);}}
  .fadein{animation:fade .35s ease both;} @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .pop{animation:pp .4s cubic-bezier(.2,1.4,.4,1) both;} @keyframes pp{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>

<script>
/* ===================== DATA ===================== */
var SUBJECTS = [
  {id:'kor', name:'국어', ic:'📖', color:'var(--kor)'},
  {id:'mat', name:'수학', ic:'🔢', color:'var(--mat)'},
  {id:'eng', name:'영어', ic:'🔤', color:'var(--eng)'},
  {id:'soc', name:'사회', ic:'🌏', color:'var(--soc)'},
  {id:'sci', name:'과학', ic:'🔬', color:'var(--sci)'}
];

/* ===== 개념정리 (4학년 1학기 단원별) ===== */
var CONCEPTS={"mat|분수와 소수":"■ 분수\n- 전체를 똑같이 나눈 것 중 몇을 나타내요. 3/4 = 4칸 중 3칸.\n■ 소수\n- 0.1처럼 소수점으로 나타낸 수. 0.7 = 7/10.","mat|분수":"■ 분수의 크기\n- 분모가 같으면 분자가 클수록 커요.\n■ 대분수·가분수\n- 1과 1/2 같은 대분수, 3/2 같은 가분수.","mat|평면도형":"■ 여러 도형\n- 삼각형(변 3), 사각형(변 4), 원.\n■ 직각\n- 반듯하게 만나는 각. 직사각형은 네 각이 직각, 정사각형은 네 변도 같아요.","mat|길이와 시간":"■ 길이\n- 1m=100cm, 1cm=10mm.\n■ 시간\n- 1시간=60분, 1분=60초.","mat|원":"■ 원\n- 한가운데(중심)에서 같은 거리에 있는 점들.\n■ 반지름·지름\n- 중심에서 원까지=반지름, 원을 가로지르면=지름(반지름의 2배).","mat|들이와 무게":"■ 들이\n- 1L=1000mL.\n■ 무게\n- 1kg=1000g.","mat|자연수의 혼합 계산":"■ 계산 순서\n- ( ) 먼저 → 곱셈·나눗셈 → 덧셈·뺄셈.\n■ 예\n- 12 + 8÷4 = 12 + 2 = 14.","mat|약수와 배수":"■ 약수\n- 어떤 수를 나누어떨어지게 하는 수. 6의 약수: 1,2,3,6.\n■ 배수\n- 어떤 수를 몇 배 한 수.\n■ 최대공약수·최소공배수도 배워요.","mat|다각형의 둘레와 넓이":"■ 둘레\n- 모든 변의 길이의 합.\n■ 넓이\n- 직사각형=가로×세로, 정사각형=한 변×한 변, 삼각형=밑변×높이÷2.","mat|분수의 곱셈":"■ 방법\n- 분자는 분자끼리, 분모는 분모끼리 곱해요.\n■ 예\n- 1/2 × 1/3 = 1/6.","mat|소수의 곱셈":"■ 방법\n- 소수점을 무시하고 곱한 뒤, 소수점 아래 자리 수만큼 소수점을 찍어요.\n■ 예\n- 0.3 × 4 = 1.2.","mat|평균과 가능성":"■ 평균\n- 자료의 합 ÷ 자료의 개수.\n■ 가능성\n- 어떤 일이 일어날 정도(불가능~반반~확실).","mat|직육면체":"■ 직육면체\n- 면 6개, 모서리 12개, 꼭짓점 8개.\n■ 정육면체\n- 모든 면이 정사각형인 직육면체.","mat|수의 범위와 어림하기":"■ 어림\n- 올림·버림·반올림으로 대략 나타내요.\n■ 반올림\n- 구하려는 자리 아래가 5 이상이면 올리고, 4 이하면 버려요.","mat|분수의 나눗셈":"■ 방법\n- 나누는 분수를 뒤집어 곱해요.\n■ 예\n- 1/2 ÷ 1/4 = 1/2 × 4 = 2.","mat|소수의 나눗셈":"■ 방법\n- 나누는 수를 자연수로 만들어(소수점을 같이 옮겨) 계산해요.\n■ 예\n- 3.6 ÷ 0.9 = 36 ÷ 9 = 4.","mat|비와 비율":"■ 비\n- 두 수를 비교. 2 : 3.\n■ 비율\n- 기준량에 대한 비교하는 양(2/3). ×100 하면 백분율(%).","mat|각기둥과 각뿔":"■ 각기둥\n- 위·아래 밑면이 같은 기둥. 삼각기둥·사각기둥.\n■ 각뿔\n- 밑면이 하나, 옆면이 삼각형으로 뾰족.","mat|원의 넓이":"■ 원주율(π)\n- 원의 둘레 ÷ 지름 ≈ 3.14.\n■ 원의 넓이\n- 반지름 × 반지름 × 3.14.","mat|원기둥·원뿔·구":"■ 원기둥\n- 밑면이 원인 기둥.\n■ 원뿔\n- 밑면이 원이고 위가 뾰족.\n■ 구\n- 공 모양.","mat|비례식과 비례배분":"■ 비례식\n- 두 비가 같음을 나타낸 식. 2:3 = 4:6.\n■ 성질\n- 외항의 곱 = 내항의 곱.","mat|공간과 입체":"■ 쌓기나무\n- 위·앞·옆에서 본 모양으로 개수와 모양을 알아봐요.","kor|맞춤법":"■ 맞춤법\n- 낱말을 바르게 쓰는 약속. '깨끗이', '며칠'이 바른 표기.\n■ 주의\n- 소리 나는 대로만 쓰지 않는 경우가 있어요.","kor|낱말의 종류":"■ 이름씨(명사)\n- 사람·사물의 이름. 책, 나무.\n■ 움직씨(동사)\n- 움직임. 뛰다, 먹다.\n■ 그림씨(형용사)\n- 상태·성질. 예쁘다, 크다.","kor|중심 생각":"■ 중심 생각\n- 글쓴이가 전하려는 가장 중요한 생각.\n■ 찾는 법\n- 제목·중심 문장·반복되는 말을 살펴요.","kor|감각적 표현":"■ 감각적 표현\n- 보고·듣고·만지고·맛본 느낌을 실감 나게 나타낸 말.\n■ 예\n- 말랑말랑(촉감), 새콤달콤(맛), 반짝반짝(모양).","kor|속담":"■ 속담\n- 옛날부터 전해 오는, 교훈이 담긴 짧은 말.\n■ 예\n- '티끌 모아 태산'(작은 것도 모으면 큼).","kor|토의":"■ 토의\n- 여럿이 의견을 모아 문제를 해결하는 것.\n■ 태도\n- 남의 의견을 존중하며 함께 정해요.","kor|낱말의 뜻 짐작":"■ 방법\n- 모르는 낱말은 앞뒤 문장(문맥)으로 뜻을 짐작하고, 국어사전으로 확인해요.","kor|요약하기":"■ 요약\n- 글의 중요한 내용만 짧게 간추리는 것.\n■ 방법\n- 중심 내용 중심으로, 덜 중요한 것은 빼요.","kor|주장과 근거":"■ 주장\n- 글쓴이가 내세우는 의견.\n■ 근거\n- 주장을 뒷받침하는 까닭·자료. 타당해야 해요.","kor|토론":"■ 토론\n- 찬성과 반대로 나뉘어, 근거를 들어 겨루는 것.\n■ 태도\n- 상대의 말을 존중하며 근거로 말해요.","kor|매체":"■ 매체\n- 글·그림·영상처럼 정보를 전하는 수단.\n■ 태도\n- 내용이 사실인지 비판적으로 살펴요.","kor|비유하는 표현":"■ 비유\n- 어떤 것을 다른 것에 빗대어 표현. '사과 같은 얼굴'.\n■ 종류\n- 직유(~같이, ~처럼), 은유(~은 ~이다).","kor|주장하는 글":"■ 짜임\n- 서론(문제·주장) - 본론(근거) - 결론(정리).\n■ 특징\n- 의견을 근거로 설득해요.","kor|타당한 근거":"■ 타당한 근거\n- 주장과 관련 있고 믿을 만한 까닭.\n■ 확인\n- 출처가 분명한 자료인지 살펴요.","kor|매체 읽기":"■ 매체 읽기\n- 광고·뉴스 등을 비판적으로 읽는 것.\n■ 주의\n- 과장·거짓 표현에 속지 않아요.","eng|알파벳":"■ 알파벳\n- A부터 Z까지 26자. 대문자·소문자가 있어요.","eng|인사":"■ 인사\n- Hello!/Hi!(안녕), Goodbye/Bye(잘 가).","eng|숫자":"■ 숫자\n- one, two … ten. five=5, ten=10.","eng|과일":"■ 과일\n- apple(사과), banana(바나나), grape(포도).","eng|동물":"■ 동물\n- cat(고양이), dog(개), rabbit(토끼).","eng|지시 표현":"■ 지시(명령)\n- Stand up.(일어서라) / Sit down.(앉아라) / Look!(봐)","eng|시간 묻기":"■ 시간\n- What time is it? – It's seven o'clock.","eng|나이 묻기":"■ 나이\n- How old are you? – I'm eleven.","eng|복수형":"■ 복수형\n- 둘 이상은 낱말 끝에 -s. two books, three apples.","eng|의문문":"■ 의문문\n- Can you ~? – Yes, I can. / No, I can't.","eng|위치 표현":"■ 위치\n- in(안), on(위), under(아래). It's on the desk.","eng|과거 표현":"■ 과거\n- 지난 일. 동사에 -ed. played, watched. yesterday와 함께 써요.","eng|시간 표현":"■ 시간\n- What time is it? – It's three o'clock.","eng|현재 표현":"■ 현재\n- 늘·반복되는 일. I go to school every day.","eng|미래 표현":"■ 미래\n- will + 동사. I will go.(갈 것이다)","eng|가격 묻기":"■ 가격\n- How much is it? – It's 1,000 won.","eng|시제 구분":"■ 시제\n- 과거(-ed) / 현재(동사원형) / 미래(will + 동사).","eng|길 묻기":"■ 길 묻기\n- Where is the bank? – It's over there. / Go straight.","eng|장래 희망":"■ 장래 희망\n- I want to be a doctor.(의사가 되고 싶어요)","eng|비교 표현":"■ 비교\n- 형용사 + er = 더 ~한. bigger(더 큰), taller(키가 더 큰).","soc|우리 고장":"■ 고장\n- 우리가 사는 곳. 자랑거리와 이야기가 있어요.","soc|지도":"■ 지도\n- 위에서 본 모습을 줄여 나타낸 그림. 기호·방위를 써요.","soc|방위":"■ 방위\n- 동·서·남·북. 지도 위쪽은 보통 북쪽, 해는 동쪽에서 떠요.","soc|고장의 장소":"■ 장소\n- 시장(사고팔기)·도서관(책)·병원(치료)처럼 쓰임이 달라요.","soc|통신의 발달":"■ 통신\n- 봉수 → 편지 → 전화 → 인터넷으로 발전했어요.","soc|교통의 발달":"■ 교통\n- 소달구지 → 자동차·기차·비행기로 발전했어요.","soc|세시 풍속":"■ 세시 풍속\n- 계절·명절마다 하는 일. 설날 세배, 추석 송편.","soc|우리나라":"■ 우리나라\n- 수도는 서울, 국기는 태극기, 글자는 한글을 써요.","soc|국토와 자연":"■ 국토\n- 우리나라 땅. 삼면이 바다이고 산과 강이 많아요.","soc|인권":"■ 인권\n- 누구나 태어나면서 가지는 소중한 권리. 서로 존중해요.","soc|법":"■ 법\n- 함께 지키기로 한 약속. 헌법은 가장 기본이 되는 법.","soc|우리 역사":"■ 흐름\n- 고조선 → 삼국(고구려·백제·신라) → 고려 → 조선.\n■ 인물\n- 세종대왕(한글), 이순신(거북선).","soc|정치 발전":"■ 민주주의 발전\n- 국민이 주인이 되는 정치로, 여러 노력을 거쳐 발전했어요.","soc|정치":"■ 정치\n- 함께 사는 문제를 해결하는 것. 선거로 대표를 뽑아요.","soc|삼권분립":"■ 삼권분립\n- 입법(국회)·행정(정부)·사법(법원)으로 나눠 서로 견제해요.","soc|우리나라 경제":"■ 경제 주체\n- 가계(가정 살림)·기업(생산)·정부.\n■ 시장\n- 물건과 서비스를 사고파는 곳.","soc|세계 여러 나라":"■ 세계\n- 여러 대륙과 대양(가장 넓은 바다=태평양).\n■ 무역\n- 나라끼리 물건을 사고파는 것.","soc|지구촌":"■ 지구촌\n- 온 세계가 이웃처럼 가까워진 것. 함께 문제를 해결해요.","sci|자석의 이용":"■ 자석\n- 철에 붙어요. 양쪽 끝(극)에서 힘이 가장 세요.\n■ N극·S극\n- 다른 극끼리 붙고, 같은 극끼리 밀어요.","sci|물질의 성질":"■ 물질\n- 물체를 이루는 재료(나무·철·고무·플라스틱).\n■ 성질\n- 단단함·잘 늘어남처럼 재료마다 달라요.","sci|동물의 생활":"■ 분류\n- 사는 곳(땅·물·하늘)에 따라 나눠요.\n■ 곤충\n- 다리 6개, 몸은 머리·가슴·배.","sci|소리의 성질":"■ 소리\n- 물체의 떨림(진동)으로 생겨요.\n■ 세기·높낮이\n- 크고 작은 소리, 높고 낮은 소리가 있어요.","sci|지구의 모습":"■ 지구\n- 바다와 육지가 있는 둥근 공 모양.\n■ 공기\n- 공기가 지구를 감싸 생물이 숨 쉬어요.","sci|빛":"■ 빛\n- 물체를 볼 수 있게 해 줘요. 곧게 나아가요.","sci|온도와 열":"■ 온도\n- 따뜻한 정도를 숫자(℃)로 나타낸 것.\n■ 열의 이동\n- 뜨거운 곳 → 찬 곳으로 이동해요.","sci|용해와 용액":"■ 용해\n- 어떤 물질이 다른 물질에 골고루 섞이는 것.\n■ 용액\n- 용해된 것(설탕물·소금물).","sci|생물과 환경":"■ 환경 요인\n- 햇빛·물·공기·흙 등이 생물에 영향을 줘요.\n■ 먹이 관계\n- 생물끼리 먹고 먹혀요.","sci|태양계와 별":"■ 태양계\n- 태양과 그 둘레를 도는 행성들.\n■ 별\n- 스스로 빛을 내요. 북극성으로 북쪽을 찾아요.","sci|날씨":"■ 날씨 요소\n- 기온·습도·바람·구름.\n■ 습도\n- 공기 중 수증기의 많고 적음.","sci|빛과 렌즈":"■ 볼록 렌즈\n- 가까운 물체를 크게 보이게 하고, 햇빛을 모아 밝고 뜨겁게 해요.","sci|전기의 이용":"■ 전기 회로\n- 끊김 없이 이어져야 불이 켜져요.\n■ 직렬 연결\n- 전지를 직렬로 늘리면 전구가 더 밝아져요.","sci|우리 몸의 구조":"■ 여러 기관\n- 소화(위·창자)·호흡(폐)·순환(심장)이 함께 일해요.","sci|연소와 소화":"■ 연소\n- 탈 물질·산소·온도(열)가 모두 있어야 타요.\n■ 소화(불 끄기)\n- 셋 중 하나를 없애면 불이 꺼져요.","sci|계절의 변화":"■ 계절\n- 지구의 자전축이 기울어진 채 공전하기 때문에 생겨요.","sci|에너지":"■ 에너지\n- 빛·열·전기·운동 등 여러 형태가 있어요.\n■ 태양\n- 빛과 열 에너지의 근원이에요.","eng|안부":"■ 안부 인사\n- How are you? – I'm fine, thanks. / I'm good.\n- How do you do?와 바꿔 쓸 수 있어요.\n■ 헤어질 때\n- See you later! / See you tomorrow!(또 봐)","kor|국어사전":"■ 국어사전\n- 낱말의 뜻을 찾는 책. ㄱㄴㄷ·ㅏㅑㅓ 순서로 실려요.\n■ 기본형으로 찾기\n- '먹었다→먹다', '예쁜→예쁘다'처럼 기본형으로 바꿔 찾아요.\n■ 찾는 순서\n- 첫 자음자 → 모음자 → 받침 순서로 비교!","kor|사실과 의견":"■ 사실\n- 실제로 있었던 일. 누가 봐도 확인할 수 있어요. 예) 오늘은 화요일이다.\n■ 의견\n- 생각이나 느낌. 사람마다 다를 수 있어요. 예) 이 책은 재미있다.\n■ 구별하는 까닭\n- 나누어 읽으면 글을 더 정확히 이해해요.","kor|내용 간추리기":"■ 간추리기(요약)\n- 중요한 내용만 짧게 정리하는 것.\n■ 중심 문장\n- 문단에서 가장 중요한 문장이 중심 문장.\n■ 방법\n- 덜 중요한 내용은 빼고, 이야기는 일이 일어난 차례대로 정리!","kor|마음을 전하는 글":"■ 마음을 전하는 글\n- 고마움·미안함·축하 같은 마음을 담아 쓰는 글.\n■ 들어갈 내용\n- 있었던 일 + 전하고 싶은 마음.\n■ 예\n- \"도와줘서 고마워. 다음엔 내가 도울게.\"","kor|제안하는 글":"■ 제안하는 글\n- 문제를 해결하려고 '~합시다'처럼 의견을 내는 글.\n■ 꼭 필요한 것\n- 제안(무엇을 하자) + 까닭(그러면 좋은 점).\n■ 좋은 제안\n- 까닭이 제안과 관련 있고 타당해야 해요.","kor|전기문":"■ 전기문\n- 인물의 삶을 사실대로 쓴 글.\n■ 담기는 내용\n- 인물이 한 일, 그 까닭, 본받을 점.\n■ 요약할 때\n- 인물이 한 일과 까닭을 중심으로!","kor|문단":"■ 문단\n- 여러 문장이 모여 하나의 생각을 이룬 덩어리.\n■ 중심 문장과 뒷받침 문장\n- 중심 문장: 문단의 핵심 생각(주로 처음·끝).\n- 뒷받침 문장: 중심 문장을 자세히 설명.","kor|높임 표현":"■ 높임 표현\n- 웃어른을 높여 말하는 방법.\n■ 방법\n- '-시-'(가신다), '께서'(할머니께서), 높임말(드시다·주무시다·진지·댁).\n■ 예\n- 먹다→드시다, 자다→주무시다, 주다→드리다.","kor|낱말의 짜임":"■ 낱말의 짜임\n- 낱말은 더 작은 부분이 합쳐져 만들어지기도 해요.\n■ 예\n- '김밥'=김+밥, '덮밥'=덮다+밥, '손수건'=손+수건.\n■ 좋은 점\n- 짜임을 알면 뜻을 쉽게 짐작할 수 있어요.","kor|낱말과 표현":"■ 비슷한 말·반대말\n- 기쁘다≈즐겁다, 크다↔작다, 느슨하다↔팽팽하다.\n■ 흉내 내는 말\n- 소리 흉내말: 멍멍, 졸졸졸.\n- 모양 흉내말: 반짝반짝, 뒤뚱뒤뚱.","kor|관용 표현":"■ 관용 표현\n- 둘 이상의 낱말이 굳어져 새로운 뜻을 나타내는 말.\n■ 예\n- '발이 넓다'=아는 사람이 많다.\n- '손이 크다'=씀씀이가 크다.\n■ 특징\n- 글자 그대로가 아니라 정해진 뜻으로 써요.","kor|시 읽기":"■ 시의 특징\n- 짧은 말에 생각·느낌을 담고, 리듬(운율)이 있어요.\n■ 표현 방법\n- 비유: '가을 하늘은 파란 도화지'처럼 빗대기.\n- 감각적 표현: 소리·모양·색을 실감 나게.","kor|이야기 읽기":"■ 이야기의 요소\n- 인물·사건·배경으로 이루어져요.\n■ 인물의 마음·성격\n- 말과 행동으로 짐작해요.\n■ 흐름 파악\n- 일이 일어난 차례(원인→결과)를 따라가요.","kor|이어 주는 말":"■ 이어 주는 말(이음말)\n- 문장과 문장을 자연스럽게 연결해요.\n■ 종류\n- 원인→결과: 그래서, 그러므로.\n- 반대: 그러나, 하지만.\n- 덧붙임: 그리고, 또한.","kor|문장의 호응":"■ 문장의 호응\n- 앞말과 뒷말이 서로 어울려야 자연스러워요.\n■ 예\n- '결코/별로' → 부정과 호응(결코 쉽지 않다).\n- '만약 ~면' → 조건과 호응(만약 비가 온다면).\n- '어제' → 과거(어제 갔다).","kor|문장의 짜임":"■ 문장의 짜임\n- 문장은 '무엇이(누가) + 어찌하다/어떠하다'로 이루어져요.\n■ 예\n- '꽃이 피었다' → '무엇이'=꽃이, '어찌하다'=피었다.\n- '하늘이 파랗다' → '무엇이'=하늘이, '어떠하다'=파랗다.","kor|낱말의 뜻 추론":"■ 낱말 뜻 짐작하기\n- 모르는 낱말은 앞뒤 문장(문맥)을 보고 뜻을 짐작해요.\n■ 예\n- \"겨울나무가 잎을 다 떨구고 앙상했다.\" → '앙상하다'=뼈만 남은 듯 마르다.\n■ 확인\n- 짐작한 뜻은 국어사전으로 확인해요.","kor|글의 목적":"■ 글의 목적\n- 글을 쓴 까닭에 따라 종류가 달라요.\n■ 종류\n- 설명하는 글: 정보를 알려 줌(이용 방법 등).\n- 주장하는 글: 의견을 내세워 설득함.\n- 마음을 전하는 글: 고마움·사과 등.","kor|독서 감상문":"■ 독서 감상문\n- 책을 읽고 생각·느낌을 쓴 글.\n■ 들어갈 내용\n- 읽은 책, 인상 깊은 부분, 느낀 점·생각.\n- (책값 같은 건 필요 없어요.)","eng|이름과 인사":"■ 인사\n- Hello!/Hi!(안녕), Good morning(아침), Goodbye/Bye(잘 가).\n■ 이름 묻고 답하기\n- What's your name? – I'm Suji. / My name is Suji.\n■ 소개\n- This is my friend. / Nice to meet you.","eng|감정":"■ 감정 묻기\n- How are you? – I'm fine, thanks.\n■ 감정 낱말\n- happy(기쁜), sad(슬픈), hungry(배고픈), tired(피곤한), angry(화난).\n■ 대답\n- Are you happy? – Yes, I am. / No, I'm not.","eng|사물":"■ 사물 묻기\n- What's this? – It's a book.\n■ 낱말\n- pencil(연필), book(책), ruler(자), chair(의자), desk(책상).\n■ 확인\n- Is this your bag? – Yes, it is. / No, it isn't.","eng|수와 개수":"■ 숫자 1~20\n- one, two … ten, eleven, twelve … twenty.\n■ 개수 묻기\n- How many? – Four.\n■ 여러 개\n- 낱말 끝에 -s. 예) two apples.","eng|색깔":"■ 색깔 묻기\n- What color is it? – It's green.\n■ 낱말\n- red(빨강), blue(파랑), yellow(노랑), green(초록), black(검정).","eng|날씨":"■ 날씨 묻기\n- How's the weather? – It's sunny.\n■ 낱말\n- sunny(맑은), rainy(비 오는), cloudy(흐린), snowy(눈 오는), windy(바람 부는).","eng|시각":"■ 시각 묻기\n- What time is it? – It's seven o'clock.\n■ 읽는 법\n- 3:30 → three thirty(=half past three).\n- 2:00 → two o'clock.","eng|요일":"■ 요일 묻기\n- What day is it today? – It's Friday.\n■ 요일\n- Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday.","eng|계절과 월":"■ 계절\n- spring(봄), summer(여름), fall/autumn(가을), winter(겨울).\n■ 좋아하는 계절\n- What's your favorite season? – I like summer.","eng|음식":"■ 좋아하는 것 말하기\n- I like chicken. / I don't like carrots.\n■ 권하기\n- Do you want some water? – Yes, please. / No, thank you.","eng|가격":"■ 가격 묻기\n- How much is it? – It's 1,000 won.\n■ 쓰임\n- 물건을 살 때 값을 물어봐요.","eng|직업":"■ 직업 말하기\n- She's a driver. / He's a doctor.\n■ 낱말\n- teacher(선생님), doctor(의사), driver(운전사), cook(요리사).","eng|위치":"■ 위치 묻기\n- Where is it? / Where are you?\n■ 전치사\n- in(안), on(위), under(아래).\n- 예) It's on the desk. / I'm in the classroom.","eng|능력":"■ 능력 말하기(can)\n- I can swim. / Can you ride a bike? – Yes, I can. / No, I can't.\n■ 뜻\n- can = ~할 수 있다.","eng|제안":"■ 제안하기\n- Let's play soccer. / Let's go to the park.\n■ 대답\n- OK, let's go! / Sounds good!","eng|명령":"■ 명령·지시(동사로 시작)\n- Open the door.(열어라) / Sit down.(앉아라)\n■ 부정 명령\n- Don't run.(뛰지 마라) / Don't push.","eng|옷차림":"■ 옷 입기\n- Put on your coat.(입어라) / Take off your hat.(벗어라)\n■ 입고 있는 중\n- She is wearing a red dress.(입고 있다)","eng|소유":"■ 소유격\n- my(나의), your(너의), her(그녀의), his(그의).\n■ 예\n- This is my book. / Whose bag is this? – It's her bag.","eng|진행형":"■ 현재진행형(be + -ing)\n- 지금 하고 있는 일을 나타내요.\n■ 예\n- What are you doing? – I'm reading a book.\n- He is running now.","eng|be동사":"■ be동사(am/is/are)\n- I am, He/She/It is, You/We/They are.\n■ 예\n- I am happy. / She is a teacher. / They are my friends.","soc|지도의 읽기와 활용":"■ 지도\n- 우리가 사는 곳을 줄여 나타낸 그림.\n■ 지도의 약속\n- 방위(동서남북, 위쪽=북쪽), 축척(실제 거리를 줄인 정도), 기호·범례.\n■ 높낮이\n- 등고선이 촘촘하면 가파른 곳이에요.","soc|문화유산":"■ 문화유산\n- 조상 대대로 물려받은 소중한 것.\n■ 종류\n- 유형(건물·유물처럼 형태 있음), 무형(판소리·탈춤처럼 형태 없음).\n■ 태도\n- 소중히 보존하고, 답사 때 예의를 지켜요.","soc|경제활동":"■ 생산과 소비\n- 생산: 물건·서비스를 만듦. 소비: 사서 씀.\n■ 합리적 선택\n- 가격·필요·만족을 함께 따져 골라요.\n■ 경제 교류\n- 지역끼리 부족한 것을 주고받아요.","soc|민주주의":"■ 민주주의\n- 여러 사람이 함께 의논해 정하는 것.\n■ 의사결정\n- 충분히 토론한 뒤 다수결로! 소수 의견도 존중해요.\n■ 참여\n- 선거(대표 뽑기), 주민 회의, 주민 자치.","soc|지역 문제와 해결":"■ 지역 문제\n- 주차 부족·쓰레기 같은 우리 지역의 어려움.\n■ 해결 순서\n- 문제 확인 → 원인 파악 → 방안 논의 → 실천 → 평가.\n■ 방법\n- 공청회·주민 회의로 함께 의논해요.","soc|자연환경과 인문환경":"■ 자연환경\n- 산·강·바다·날씨(기온·강수량)처럼 저절로 있는 것.\n■ 인문환경\n- 도로·항구·공장·건물처럼 사람이 만든 것.\n■ 이용과 개발\n- 자연 보호와 균형을 함께 생각해요.","soc|도시의 특징":"■ 도시\n- 인구가 많고 높은 건물·편의 시설이 발달한 곳.\n■ 발달 조건\n- 교통이 편리하고 일자리가 많아요.\n■ 도시 문제와 해결\n- 교통 혼잡 등 → 대중교통 늘리기 등으로 해결.","sci|물의 상태 변화":"■ 물의 세 가지 상태\n- 고체(얼음), 액체(물), 기체(수증기).\n■ 상태 변화\n- 증발: 물이 수증기로. 응결: 수증기가 물로(유리창 물방울).\n- 물이 얼면 부피가 늘어요.\n■ 물의 순환\n- 증발→구름→비로 돌고 돌아요.","sci|화산과 지진":"■ 화산\n- 땅속 마그마가 분출. 나오는 것: 용암·화산재·화산 가스.\n- 이로움: 온천·지열 이용. 해로움: 농작물·마을 피해.\n■ 지진\n- 땅이 흔들리는 것. 대비: 내진 설계, 가구 고정.\n- 지진 시: 책상 아래로 몸을 피해요.","sci|그림자와 거울":"■ 그림자\n- 빛이 물체에 막혀 생겨요(빛+물체 필요).\n- 빛에 가까이 하면 그림자가 커져요. 그림자는 빛의 반대쪽에!\n■ 거울\n- 빛을 반사해요. 비친 모습은 좌우가 바뀌어 보여요.","mat|곱셈":"■ (세 자리 수)×(몇십)\n- 먼저 (세 자리)×(몇)을 하고 뒤에 0을 하나 붙여요.\n- 예) 300×20 → 3×2=6 → 6000.\n■ (세 자리 수)×(몇십몇)\n- 몇십과 몇으로 나눠 곱한 뒤 더해요.\n- 예) 365×62 = 365×60 + 365×2.\n■ 자리 맞추기\n- 곱한 값을 자리에 맞춰 세로로 더해요.","mat|나눗셈":"■ (세 자리 수)÷(몇십)\n- 몫이 몇 번 들어가는지 어림해서 구해요.\n- 예) 240÷30 = 8.\n■ (세 자리 수)÷(몇십몇)\n- 어림한 몫으로 곱해 보고, 크면 몫을 줄여요.\n- 나머지는 나누는 수보다 항상 작아야 해요.\n■ 검산\n- (몫 × 나누는 수) + 나머지 = 나뉘는 수.","mat|분수의 덧셈과 뺄셈":"■ 분모가 같은 분수의 덧셈\n- 분모는 그대로, 분자끼리 더해요. 예) 2/5 + 1/5 = 3/5.\n■ 분모가 같은 분수의 뺄셈\n- 분모는 그대로, 분자끼리 빼요. 예) 4/6 − 1/6 = 3/6.\n■ 대분수 계산\n- 자연수는 자연수끼리, 분수는 분수끼리 계산해요.\n- 분자가 분모보다 커지면 대분수로 고쳐요.","mat|소수의 덧셈과 뺄셈":"■ 소수 알아보기\n- 0.1이 몇 개인지로 크기를 알 수 있어요. 예) 0.1이 7개 = 0.7.\n■ 소수의 덧셈·뺄셈\n- 소수점의 자리를 맞춰 세로로 계산해요.\n- 예) 0.6 + 0.3 = 0.9, 0.8 − 0.5 = 0.3.\n■ 주의\n- 소수점끼리 반드시 세로로 나란히 맞춰요.","mat|삼각형":"■ 변의 길이로 나누기\n- 정삼각형: 세 변의 길이가 모두 같음.\n- 이등변삼각형: 두 변의 길이가 같음.\n■ 각의 크기로 나누기\n- 예각삼각형: 세 각이 모두 예각.\n- 직각삼각형: 한 각이 직각.\n- 둔각삼각형: 한 각이 둔각.\n■ 세 각의 합\n- 삼각형 세 각의 크기의 합은 항상 180도.","mat|사각형":"■ 수직과 평행\n- 수직: 두 직선이 만나 이루는 각이 직각(90도).\n- 평행: 아무리 늘여도 만나지 않는 두 직선.\n■ 여러 가지 사각형\n- 사다리꼴: 평행한 변이 한 쌍 있는 사각형.\n- 평행사변형: 마주 보는 두 쌍의 변이 평행.\n- 마름모: 네 변의 길이가 모두 같음.\n- 직사각형·정사각형도 사각형의 한 종류예요.","mat|다각형":"■ 다각형이란\n- 선분으로만 둘러싸인 도형. 변의 수로 이름을 붙여요.\n- 오각형(5), 육각형(6), 칠각형(7)…\n■ 정다각형\n- 변의 길이와 각의 크기가 모두 같은 다각형.\n■ 대각선\n- 이웃하지 않은 두 꼭짓점을 잇는 선분.","mat|꺾은선그래프":"■ 꺾은선그래프란\n- 시간에 따른 변화를 점을 찍고 선으로 이어 나타낸 그래프.\n■ 특징\n- 변화의 모습(늘어남·줄어듦)을 한눈에 볼 수 있어요.\n- 선이 위로 가면 늘고, 아래로 가면 줄어요.\n■ 그리는 순서\n- 가로(시간)·세로(값) 정하기 → 점 찍기 → 선으로 잇기 → 제목 쓰기.\n■ 막대그래프와 차이\n- 막대그래프는 많고 적음 비교, 꺾은선그래프는 변화를 보기에 좋아요.","mat|큰 수":"■ 큰 수 읽기\n- 10000(만)이 모여 십만·백만·천만·억이 돼요.\n- 1억 = 10000이 10000개 = 0이 8개 (100000000).\n■ 자리값\n- 오른쪽부터 일·십·백·천·만… 자리예요.\n- 예) 35000 = 3만 5천.\n■ 큰 수 비교\n- 자리 수가 많을수록 큰 수예요.\n- 자리 수가 같으면 가장 높은 자리부터 숫자를 비교해요.","mat|각도":"■ 각의 종류\n- 예각: 직각(90도)보다 작은 각.\n- 직각: 90도.\n- 둔각: 직각보다 크고 180도보다 작은 각.\n■ 각도 재기\n- 각도기로 재고, 단위는 도(°)예요.\n- 곧은 직선(평각)은 180도.\n■ 각도의 합과 차\n- 각도끼리 더하고 뺄 수 있어요. 예) 30°+45°=75°.\n■ 삼각형의 세 각\n- 삼각형 세 각의 크기의 합은 항상 180도예요.","mat|곱셈과 나눗셈":"■ (세 자리 수)×(몇십, 몇십몇)\n- 자리마다 곱한 뒤 자리에 맞춰 더해요.\n- 예) 300×20 → 3×2=6, 뒤에 0을 붙여 6000.\n■ (세 자리 수)÷(몇십, 몇십몇)\n- 몇 번 들어가는지 어림한 뒤 나눠요.\n- 나머지가 생길 수 있어요.\n■ 검산\n- (몫 × 나누는 수) + 나머지 = 나뉘는 수.","mat|평면도형의 이동":"■ 밀기\n- 위치만 바뀌고 모양·크기·방향은 그대로예요.\n■ 뒤집기\n- 방향이 바뀌어요.\n- 좌우로 뒤집으면 좌우가, 위아래로 뒤집으면 위아래가 바뀝니다.\n■ 돌리기\n- 시계 방향·반대 방향으로 돌려요(90도·180도 등).\n- 한 바퀴(360도) 돌리면 처음과 같아요.\n■ 공통점\n- 어떤 이동이든 모양과 크기는 변하지 않아요.","mat|막대그래프":"■ 막대그래프란?\n- 자료의 크기를 막대의 길이로 나타낸 그래프예요.\n■ 구성요소\n- 제목 · 가로(항목) · 세로(수/눈금).\n■ 읽는 법\n- 막대가 길수록 값이 커요.\n- 눈금 한 칸의 크기를 꼭 확인! 예) 한 칸 5명, 막대 3칸 → 15명.\n■ 그리는 순서\n- 표로 정리 → 눈금 정하기 → 막대 그리기 → 제목 쓰기.","mat|규칙 찾기":"■ 수의 배열\n- 몇씩 커지는지/작아지는지, 몇 배가 되는지 규칙을 찾아요.\n- 예) 2,4,6,8 → 2씩 커짐 / 1,2,4,8 → 2배씩.\n■ 모양의 배열\n- 반복되는 모양과 개수의 규칙을 찾아요.\n■ 계산식의 배열\n- 커지는 규칙을 식으로 나타낼 수 있어요.","kor|사전은 내 친구":"■ 국어사전\n- 낱말의 뜻을 찾는 책. ㄱㄴㄷ·ㅏㅑㅓ 순서로 실려요.\n■ 기본형\n- 사전에는 '먹다, 예쁘다'처럼 기본형으로 실려요.\n- '먹었다→먹다', '예쁜→예쁘다'로 바꿔서 찾아요.\n■ 찾는 방법\n- 첫 자음자 → 모음자 → 받침 순서로 비교해 찾아요.","kor|회의를 해요":"■ 회의란?\n- 여럿이 의논해 함께 결정하는 것.\n■ 역할\n- 사회자(진행) · 기록자(적기) · 참여자(의견 내기).\n■ 절차\n- 주제 정하기 → 의견 내기 → 정리 → 다수결로 결정.\n■ 예절\n- 손 들고 말하기, 남의 의견 존중, 끝까지 듣기.\n- 의견에는 그렇게 생각한 까닭을 함께 말해요.","kor|일에 대한 의견":"■ 사실과 의견\n- 사실: 실제로 있었던 일(확인할 수 있음). 예) 오늘은 화요일이다.\n- 의견: 생각·느낌. 예) 이 책은 재미있다.\n■ 왜 구별할까?\n- 사실과 의견을 나누면 글을 정확히 이해할 수 있어요.\n■ 의견 쓰기\n- 의견에는 그렇게 생각한 까닭을 함께 써요.","kor|내용을 간추려요":"■ 간추리기(요약)\n- 중요한 내용만 짧게 정리하는 것.\n■ 중심 문장·문단\n- 문단에서 가장 중요한 문장이 중심 문장이에요.\n- 여러 문장이 모여 한 생각을 이루면 문단.\n■ 방법\n- 덜 중요한 내용은 빼고 중심 내용만 남겨요.\n- 이야기는 일이 일어난 차례대로 간추려요.","kor|이런 제안 어때요":"■ 제안하는 글\n- 문제를 해결하려고 '~합시다'처럼 의견을 내는 글.\n■ 들어갈 내용\n- 제안(무엇을 하자) + 까닭(그러면 좋은 점).\n■ 예시\n- \"복도에서 뛰지 맙시다. 다칠 수 있기 때문입니다.\"","kor|인물의 마음을 알아봐요":"■ 마음 짐작하기\n- 인물의 표정·행동·말·처한 상황으로 마음을 짐작해요.\n■ 예시\n- 상을 받으면 '기쁘다/뿌듯하다', 친구가 다치면 '걱정된다'.\n■ 좋은 점\n- 마음을 헤아리며 읽으면 이야기가 더 재미있어요.","eng|인사와 소개":"■ 인사\n- Hello!/Hi!(안녕), Goodbye/Bye(잘 가), Good morning(아침 인사).\n■ 이름 묻고 답하기\n- What's your name? – I'm Minji. / My name is Minji.\n■ 소개\n- This is my friend.(친구 소개) / Nice to meet you.(반가워).","eng|안부와 감정":"■ 안부\n- How are you? – I'm fine, thanks. / I'm good.\n■ 감정 낱말\n- happy(기쁜), sad(슬픈), hungry(배고픈), tired(피곤한), angry(화난), sleepy(졸린).\n■ 대답\n- Are you happy? – Yes, I am. / No, I'm not.","eng|사물 묻고 답하기":"■ 사물 묻기\n- What's this? – It's a book.(그것은 책이야)\n■ 낱말\n- pencil(연필), book(책), ball(공), chair(의자), desk(책상), ruler(자).\n■ 확인하기\n- Is this your bag? – Yes, it is. / No, it isn't.","eng|수와 개수":"■ 숫자 1~10\n- one, two, three, four, five, six, seven, eight, nine, ten.\n■ 개수 묻기\n- How many? – Four.(네 개)\n- 여러 개는 낱말 끝에 -s. 예) two apples(사과 두 개).","eng|좋아하는 것":"■ 좋아하는 것 말하기\n- I like apples.(좋아해) / I don't like carrots.(안 좋아해)\n■ 묻고 답하기\n- Do you like pizza? – Yes, I do. / No, I don't.\n■ 낱말\n- soccer(축구), music(음악), banana(바나나), grapes(포도).","soc|지역의 위치와 특성":"■ 지도\n- 우리가 사는 곳을 줄여서 나타낸 그림이에요.\n■ 방위\n- 동·서·남·북. 방위표가 없으면 지도의 위쪽이 북쪽.\n- 해는 동쪽에서 떠요.\n■ 지도의 약속\n- 기호(산·강 등을 간단히 표시), 축척(실제 거리를 줄인 정도), 범례.\n■ 도구\n- 방향을 찾을 때 나침반을 써요.","soc|우리가 알아보는 지역의 역사":"■ 문화유산\n- 조상 대대로 물려받은 소중한 것.\n- 유형(건물·유물처럼 모양이 있음), 무형(판소리·강강술래처럼 모양이 없음).\n■ 조사 방법\n- 답사(직접 가 보기), 문헌·인터넷 조사, 박물관 관람.\n■ 태도\n- 소중히 보존하고, 지역의 자랑거리로 알려요.","soc|지역의 공공기관과 주민 참여":"■ 공공기관\n- 주민 모두를 위해 일하는 곳. 소방서·경찰서·도서관·병원·우체국 등.\n- (문구점 같은 개인 가게는 공공기관이 아니에요.)\n■ 주민 참여\n- 지역 일을 주민이 스스로 참여해 정하는 것.\n- 주민 회의·투표, 서명, 의견 제시 등으로 참여해요.\n■ 지역 문제 해결\n- 주민이 함께 의논해서 해결해요.","sci|지층과 화석":"■ 지층\n- 자갈·모래·진흙이 오랜 시간 쌓여 층을 이룬 것.\n- 아래층이 위층보다 먼저 쌓였어요.\n■ 화석\n- 옛날 생물의 몸이나 흔적이 돌에 남은 것.\n- 화석으로 옛 생물과 그때의 환경을 알 수 있어요.\n■ 잘 만들어지려면\n- 생물이 퇴적물 속에 빨리 묻혀야 잘 남아요.","sci|식물의 한살이":"■ 한살이 과정\n- 씨 → 싹(발아) → 자람 → 꽃 → 열매(씨).\n■ 씨가 싹트려면\n- 물이 필요해요(알맞은 온도도 필요).\n■ 식물의 각 부분\n- 뿌리(물 흡수), 줄기(지지·물길), 잎(양분 만들기), 꽃·열매(씨).\n■ 광합성\n- 잎에서 햇빛을 받아 스스로 양분을 만들어요.","sci|물체의 무게":"■ 무게\n- 물체의 무거운 정도. 단위는 g(그램)·kg. 1kg=1000g.\n■ 재는 도구\n- 저울(용수철저울, 양팔저울 등).\n■ 용수철저울\n- 무거울수록 용수철이 더 많이 늘어나는 성질을 이용해요.\n■ 양팔저울\n- 수평이면 두 물체의 무게가 같고, 내려간 쪽이 더 무거워요.\n- 잴 때는 평평한 곳에 두어요.","sci|혼합물의 분리":"■ 혼합물\n- 두 가지 이상이 섞여 있는 것.\n■ 분리 방법\n- 크기가 다른 고체: 체로 거르기.\n- 철이 섞였을 때: 자석 이용.\n- 물에 녹는 것(소금물): 물을 증발시켜 얻기.\n- 뜨고 가라앉음 차이: 물에 넣어 분리.\n■ 왜 분리할까?\n- 필요한 것을 얻기 위해서. 예) 바닷물에서 소금(염전)."};
function conceptFor(subject,unit){ return (CONCEPTS[subject+'|'+unit])||null; }
function fmtConcept(txt){
  return String(txt).split('\n').map(function(ln){
    ln=ln.replace(/\r$/,'').trim(); if(!ln) return '';
    if(ln.charAt(0)==='\u25a0') return '<div class="cnc-h jua">'+esc(ln.slice(1).trim())+'</div>';
    if(ln.charAt(0)==='-') return '<div class="cnc-b"><span class="cnc-dot">\u2022</span>'+esc(ln.slice(1).trim())+'</div>';
    return '<div class="cnc-b">'+esc(ln)+'</div>';
  }).join('');
}
function conceptPlainText(txt){
  return String(txt).split('\n').map(function(ln){ ln=ln.replace(/\r$/,'').trim(); if(!ln)return ''; if(ln.charAt(0)==='\u25a0')return ln.slice(1).trim(); if(ln.charAt(0)==='-')return ln.slice(1).trim(); return ln; }).filter(Boolean).join('. ');
}
function readConcept(){ try{ var t=conceptFor(S.concept.subject,S.concept.unit)||''; if(t) speak(conceptPlainText(t),'ko-KR'); }catch(e){} }
function stopTts(){ try{ window.speechSynthesis.cancel(); }catch(e){} }
function viewConcept(){
  var subject=S.concept.subject, unit=S.concept.unit;
  var s=findSub(subject)||{ic:'\ud83d\udcd8',name:subject,color:'var(--purple)'};
  var txt=conceptFor(subject,unit)||'\uac1c\ub150 \uc815\ub9ac\uac00 \uc900\ube44 \uc911\uc774\uc5d0\uc694.';
  var tts = ttsOn() ? '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" data-act="readConcept">\ud83d\udd0a \uc77d\uc5b4\uc8fc\uae30</button><button class="btn ghost" style="flex:1" data-act="stopTts">\u23f9 \uba48\ucda4</button></div>' : '';
  return '<div class="app"><div class="scroll"><div class="topbar"><button class="backb" data-act="backConcept">\u2039 \ub4a4\ub85c</button><span class="ebs">\uac1c\ub150 \uc815\ub9ac</span></div>'+
    '<div class="wrap"><div class="subj-hero pop" style="background:'+s.color+'"><div class="ic">\ud83d\udcd6</div><div class="jua" style="font-size:20px;margin-top:6px">'+s.name+' \u00b7 '+esc(unit)+'</div><div class="mini" style="color:#fff;opacity:.9;margin-top:2px">\uac1c\ub150 \uc815\ub9ac</div></div>'+
    '<div class="card" style="margin-top:14px">'+fmtConcept(txt)+'</div>'+
    tts+
    '<button class="btn mint" style="margin-top:12px" data-act="restudy" data-v="'+esc(subject)+'" data-u="'+esc(unit)+'">\u270f\ufe0f \uc774 \ub2e8\uc6d0 \ubb38\uc81c \ud480\uae30 \u25b6</button>'+
    '<div style="height:16px"></div></div></div></div>';
}

function subjStartGrade(id){var m=99;BANK[id].forEach(function(q){if(q.g<m)m=q.g;});return m;}
function eligibleConcept(subject){var out=[];(BANK[subject]||[]).forEach(function(q,qi){if(q.g===S.grade)out.push({q:q,qi:qi});});return out;}
function eligiblePerf(subject){var out=[];(PERF[subject]||[]).forEach(function(q,qi){if(q.g===S.grade)out.push({q:q,qi:qi});});return out;}
function seenKey(mode,subject,qi){return mode+'|'+subject+'|'+qi;}
/* 이미 푼 문제는 뒤로, 안 푼 문제부터(섞어서) 내보내 반복을 줄임 */
function orderBySeen(list,mode,subject){
  var unseen=[],seen=[];
  list.forEach(function(e){ if(S.seen[seenKey(mode,subject,e.qi)]) seen.push(e); else unseen.push(e); });
  return shuffle(unseen).concat(shuffle(seen));
}
/* 서술형에 부적합한 '객관식형' 문제 제외: 보기(선택지)를 전제로 하거나 정답이 문장/구인 경우 */
function writtenOK(q){
  var t=q.q||'';
  if(/다음 중|다음을|다음에|고르|골라|나열|순서로 알맞|순서대로|같은 것은|아닌 것은|옳은 것|맞는 것|바르게 쓴 것/.test(t)) return false;
  if(/알맞은 것/.test(t) && !/___|빈칸/.test(t)) return false;   // 빈칸 없는 '알맞은 것은?'은 선택형
  var a=String((q.c&&q.c[q.a])!=null?q.c[q.a]:'').trim();
  if(!a || a.length>7) return false;                 // 너무 긴 문장형 정답 제외
  if(/[.?!]/.test(a)) return false;                  // 문장부호 있는 문장형 정답 제외
  if((a.match(/\s/g)||[]).length>1) return false;    // 공백 2개 이상(구/문장) 제외
  return true;
}
function eligibleWritten(subject){ return eligibleConcept(subject).filter(function(e){return writtenOK(e.q);}); }
function poolFor(subject,mode){ return mode==='written'?eligibleWritten(subject):eligibleConcept(subject); }
/* 개념: 안 푼 문제 우선 + 단원을 골고루(단원당 1문항 먼저) 담아 한 회차로 진도를 채움 */
function pickConcept(subject,mode,cap){
  var pool=orderBySeen(poolFor(subject,mode),mode,subject);
  var out=[],usedUnit={};
  pool.forEach(function(e){ if(out.length<cap && !usedUnit[e.q.u]){ out.push(e); usedUnit[e.q.u]=1; } });
  pool.forEach(function(e){ if(out.length<cap && out.indexOf(e)===-1) out.push(e); });
  return out;
}
function pickForGrade(subject,mode){
  if(mode==='perf') return orderBySeen(eligiblePerf(subject),'perf',subject).slice(0,4);
  if(mode==='written') return pickConcept(subject,'written',6);
  return pickConcept(subject,'concept',Math.max(1,unitsForGrade(subject).length));
}
/* '이어서 학습하기 / 더 풀기': 안 푼 문제가 있는 과목을 찾아 이동 */
function nextConceptTarget(mode){
  mode=mode||'concept';
  var av=availSubjects();

    var sub=av[i].id;

function continueLearn(mode){
  mode=mode||'concept';
  var t=nextConceptTarget(mode);
  if(t){ startQuiz(t.subject,mode); return; }
  if(S.wrong.length){ openReview(); return; }
  var av=availSubjects();
  if(mode!=='written'){
    for(var i=0;i<av.length;i++){
      if(eligiblePerf(av[i].id).some(function(e){return !S.seen[seenKey('perf',av[i].id,e.qi)];})){ startQuiz(av[i].id,'perf'); return; }
    }
  }
  for(var j=0;j<av.length;j++){ if(poolFor(av[j].id,mode).length){ startQuiz(av[j].id,mode); return; } }
}
function availSubjects(){return SUBJECTS.filter(function(s){return S.grade>=subjStartGrade(s.id);});}
function unitsForGrade(subject){var seen={},arr=[];eligibleConcept(subject).forEach(function(e){if(!seen[e.q.u]){seen[e.q.u]=1;arr.push(e.q.u);}});return arr;}
function unitDone(subject,u){return !!(S.unitsDone[subject]&&S.unitsDone[subject][gKey(S.grade,u)]);}
function progressPct(subject){
  var us=unitsForGrade(subject);if(!us.length)return 0;
  var d=0;us.forEach(function(u){if(unitDone(subject,u))d++;});
  return Math.round(d/us.length*100);
}
/* 그 학년의 모든 과목 학습(개념 진도)이 100%인지 */

}

function ttsOn(){ try{ return !!window.speechSynthesis; }catch(e){ return false; } }
function pickEnglish(text){
  var m=String(text||'').match(/[A-Za-z][A-Za-z'.\- ]*[A-Za-z]|[A-Za-z]/g);
  if(!m) return '';
  return m.map(function(s){return s.trim();}).filter(function(s){return s.length>0;}).join(', ');
}
function englishSpeakText(cur){
  if(!cur) return '';
  var q=pickEnglish(cur.q);
  if(q && q.replace(/[, ]/g,'').length>=2) return q;   // 문제에 영어가 있으면 그것을
  var fromChoices=(cur.c||[]).map(function(ch){return pickEnglish(ch);}).filter(function(s){return s.replace(/[, ]/g,'').length>=2;});
  return fromChoices.join(', ');
}
/* 문제 영어 → 보기 영어를 순서대로 읽는 목록 만들기 */
function englishSpeakSeq(cur){
  var items=[];
  if(!cur) return items;
  var q=pickEnglish(cur.q);
  if(q && q.replace(/[, ]/g,'').length>=2) items.push({t:q, lang:'en-US'});
  var labels=['가','나','다','라'];
  (cur.c||[]).forEach(function(ch,idx){
    var e=pickEnglish(ch);
    if(e && e.replace(/[, ]/g,'').length>=1){
      items.push({t:labels[idx]||'', lang:'ko-KR'});   // 보기 번호(가·나·다·라)
      items.push({t:e, lang:'en-US'});                 // 보기 영어
    }
  });
  return items;
}
function autoReadEnglish(){
  try{
    if(S.muted) return;
    if(!S.screen) return;
    if(['subject','concept','vocab','vocabquiz','locked','perfempty'].indexOf(S.screen.type)>=0) return;
    var list=S.qList; if(!list||!list.length||S.qDone) return;
    var cur=list[S.qi]; if(!cur || cur._subject!=='eng') return;
    if(S.qPicked!==null) return;                 // 이미 답한 상태면 재생 안 함
    var seq=englishSpeakSeq(cur); if(!seq.length) return;
    speakSeq(seq,S.enRate||1.0);
  }catch(e){}
}
function speakEnglishNow(){
  try{ var list=S.qList; if(!list)return; var cur=list[S.qi]; if(!cur)return; var r=S.enRate||1.0; var seq=englishSpeakSeq(cur); if(seq.length) speakSeq(seq,r); else { var t=pickEnglish(cur.c[cur.a]); if(t) speak(t,'en-US',r); } }catch(e){}
}
function speak(text,lang,rate){ if(!ttsOn())return; try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang=lang||'ko-KR'; u.rate=rate||0.9; window.speechSynthesis.speak(u); }catch(e){} }
function speakSeq(items,rate){ if(!ttsOn())return; try{ window.speechSynthesis.cancel(); var i=0; (function nx(){ if(i>=items.length)return; var it=items[i++]; var u=new SpeechSynthesisUtterance(it.t); u.lang=it.lang; u.rate=rate||0.9; u.onend=nx; window.speechSynthesis.speak(u); })(); }catch(e){} }

function addGalleryPhoto(file){
  try{
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var max=900, w=img.width, h=img.height;
        if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        var data=cv.toDataURL('image/jpeg',0.6);
        if(!S.gallery)S.gallery=[];
        S.gallery.unshift({id:Date.now(), img:data, date:todayStr()});
        S.galMsg='';
        try{ saveState(); if(localStorage.getItem(SAVE_KEY)===null){ throw new Error('quota'); } }
        catch(err){ S.gallery.shift(); S.galMsg='저장 공간이 부족해요. 오래된 사진을 지운 뒤 다시 시도해 주세요.'; }
        render();
      };
      img.onerror=function(){ S.galMsg='이미지를 불러올 수 없어요.'; render(); };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }catch(e){ S.galMsg='사진 추가에 실패했어요.'; render(); }
}
function delGalleryPhoto(id){
  S.gallery=(S.gallery||[]).filter(function(p){return String(p.id)!==String(id);});

function startVocabQuiz(n){
  function sh(arr){ for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;} return arr; }
  var count=Math.min(n||8,VOCAB.length);
  var pool=sh(VOCAB.slice()).slice(0,count);
  var list=pool.map(function(c){
    var others=sh(VOCAB.filter(function(x){return x.kor.word!==c.kor.word;}));
    var opts=sh([c.kor.word, others[0].kor.word, others[1].kor.word, others[2].kor.word]);
    return {def:c.kor.def, c:opts, a:opts.indexOf(c.kor.word), word:c.kor.word, hanja:c.kor.hanja, eng:c.eng.word, idiom:c.idiom};
  });
  S.vq={list:list,i:0,picked:null,correct:0,done:false};
  S.screen={type:'vocabquiz'}; render();
}
function vqPick(idx){
  var vq=S.vq; if(!vq||vq.picked!==null)return;

  render();
}
function vqNext(){

function aiKey(subject,unit){ return S.grade+'|'+subject+'|'+unit; }
function validateAIQ(o,subject,unit){
  if(!o||typeof o.q!=='string'||!Array.isArray(o.c)||o.c.length!==4) return null;
  var a=(typeof o.a==='number')?o.a:parseInt(o.a,10); if(isNaN(a)||a<0||a>3) return null;

}
function launchAIList(qs, subject){

  var list=qs.map(function(q){ var o=Object.assign({},q); o._subject=o._subject||subject; if(o._qi===undefined)o._qi='ai'; o._mode='concept'; return shuffleChoices(o); });
  S.planCtx=null; S.screen={type:'quiz',subject:subject}; S.qMode='concept'; S.qList=list; S.qi=0; S.qPicked=null; S.qOXpick=null; S.qCorrect=0; S.qAnswers=[]; S.qDone=false; S.qWritten=''; S.qWrittenOk=false; render();
}
function startAISet(){
  var topic=todayTopic(); if(!topic){ return; }
  var key=aiKey(topic.subject,topic.unit);
  if(!S.aiBank) S.aiBank={};
  var cached=S.aiBank[key]||[];
  if(cached.length>=5){ /* 캐시 재사용(오프라인) */ var pick=cached.slice().sort(function(){return Math.random()-0.5;}).slice(0,5); launchAIList(pick, topic.subject); return; }

function normAns(s){ return String(s).toLowerCase().replace(/\s+/g,'').replace(/[.,!?()~·・「」『』"'’‘“”\/→\-]/g,''); }

  var a=normAns(input), b=normAns(correct);

  if(toks.indexOf(a)>=0) return true;
  if(b.length>=2 && (a.indexOf(b)>=0 || (a.length>=3 && b.indexOf(a)>=0))) return true;
  return false;
}
function keyTokens(s){
  s=String(s).replace(/(와|과|이나|나)\s+/g,' ');
  var parts=s.split(/[()\[\]{}·・、,.\/→~\-\s'"’‘“”:;!?]+/);
  var toks=[];
  function push(t){ if(t && t.length>=2 && toks.indexOf(t)<0) toks.push(t); }
  parts.forEach(function(p){
    var t=normAns(p); if(!t) return;
    var num=t.match(/^\d+/); if(num){ push(num[0]); return; }
    var stem=t.replace(/(으로|에서|에게|을|를|은|는|이|가)$/,'');
    if(stem.length>=2) t=stem;
    push(t);
  });
  return toks;
}
function tokPresent(a,t){
  if(a.indexOf(t)>=0) return true;
  if(t.length>=4 && a.indexOf(t.slice(0,2))>=0) return true;

function checkWritten(input,correct){

  var toks=keyTokens(correct);

  var present=toks.filter(function(t){ return tokPresent(a,t); });
  if(toks.length===1) return present.length===1;      // 핵심 낱말 1개면 포함해야 정답

    body:JSON.stringify({

      system:"너는 초등학생("+S.grade+"학년, 이름 "+S.name+")의 공부를 돕는 다정한 학습 친구 '별이'야. 학교 진도에 맞춰 쉽게 설명해. 초등학생 눈높이로 아주 쉽고 짧게, 어려운 낱말은 풀어서, 예시나 비유를 들어. 답을 바로 다 알려주기보다 먼저 스스로 생각하도록 짧은 힌트를 주고 격려해. 그래도 어려워하면 친절히 정답과 풀이를 알려줘. 따뜻한 말투로 이모지를 가끔 쓰고 3~5문장으로 간결하게. 공부와 무관하거나 부적절한 이야기는 부드럽게 공부로 돌려줘.",
      messages:history
    })
  }).then(function(r){return r.json();}).then(function(data){
    var txt=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').trim();
    if(!txt)txt="앗, 별이가 잠깐 멍했어요. 다시 한 번 물어봐 줄래요? 🙏";
    S.msgs.push({r:'b',t:txt}); S.tutorLoading=false; render();
  }).catch(function(){
    S.msgs.push({r:'b',t:"지금은 별이와 연결이 어려워요 😢 (AI 답변은 Claude 앱 안에서 실행할 때 작동해요.) 문제 풀이는 계속 이용할 수 있어요!"});
    S.tutorLoading=false; render();
  });
}

/* ===================== EVENTS ===================== */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t)return;
  var act=t.getAttribute('data-act'); var v=t.getAttribute('data-v');
  ac();
  if(act!=='qPick' && act!=='qOX' && act!=='qSubmit' && act!=='buy' && act!=='toggleSound') sndClick();
  if(act==='onbGrade'){ var ni0=document.getElementById('nameInput'); if(ni0) S.name=ni0.value; S.grade=parseInt(v,10); render(); }
  else if(act==='onbStart'){ var ni=document.getElementById('nameInput'); S.name=ni?ni.value.trim():''; if(S.name&&S.grade){ S.dxList=buildDiagnostic(); S.dxQi=0; S.dxCorrect=0; S.onbStep=1; render(); } }
  else if(act==='dxPick'){
    var dcur=S.dxList[S.dxQi]; if(dcur && parseInt(v,10)===dcur.a)S.dxCorrect++;
    if(S.dxQi+1<S.dxList.length){ S.dxQi++; render(); }
    else { var tot=S.dxList.length||3; S.level=S.dxCorrect>=tot?'실력':S.dxCorrect>=Math.ceil(tot*0.6)?'보통':'기초'; S.booted=true; render(); }
  }
  else if(act==='tab'){ if(v==='calendar')S.calYM=''; S.tab=v; S.screen=null; render(); }
  else if(act==='openSubject'){ openSubject(v); }
  else if(act==='continueMission'){ continueMission(); }
  else if(act==='continueLearn'){ continueLearn(t.getAttribute('data-mode')||'concept'); }
  else if(act==='startUnit'){ startUnitQuiz(v, t.getAttribute('data-unit')); }
  else if(act==='openConcept'){ S.concept={subject:t.getAttribute('data-sub'),unit:t.getAttribute('data-unit')}; S.screen={type:'concept'}; render(); }
  else if(act==='backConcept'){ stopTts(); S.screen={type:'subject',subject:S.concept.subject}; render(); }
  else if(act==='startPlanDay'){ startPlanDay(S.courseWeek||0, parseInt(v,10)); }
  else if(act==='startConcept'){ startQuiz(v,'concept'); }
  else if(act==='startPerf'){ startQuiz(v,'perf'); }
  else if(act==='nextSubject'){ startQuiz(v,'concept'); }
  else if(act==='openReview'){ openReview(false); }
  else if(act==='reviewDue'){ openReview(true); }
  else if(act==='aiDaily'){ startAIDaily(); }
  else if(act==='aiSet'){ startAISet(); }
  else if(act==='setSource'){ S.importSource = (S.importSource===v?'':v); render(); }
  else if(act==='doImport'){ var ta=document.getElementById('importQ'); var txt=ta?ta.value:(S.importText||''); var res=parseImport(txt, S.importSource||''); if(res.err){ S.importMsg=res.err; } else { S.importMsg='✅ '+res.total+'문제를 추가했어요!'+(S.importSource?(' (출처: '+S.importSource+')'):''); S.importText=''; } S.confirmClear=false; render(); }
  else if(act==='doImportURL'){ var iu=document.getElementById('importUrl'); importFromURL(iu?iu.value:(S.importUrl||''), S.importSource||''); }
  else if(act==='doCloudSync'){ var cu=document.getElementById('cloudUrl'); if(cu)S.cloudUrl=cu.value; syncCloud(true); }
  else if(act==='toggleCloudAuto'){ S.cloudAuto=!S.cloudAuto; render(); }
  else if(act==='clearImport'){ if(S.confirmClear){ S.imported={kor:[],mat:[],eng:[],soc:[],sci:[]}; S.importMsg='가져온 문제를 비웠어요. (새로고침하면 완전히 반영)'; S.confirmClear=false; } else { S.confirmClear=true; } render(); }
  else if(act==='promote'){ promoteGrade(); }
  else if(act==='openStudyDay'){ S.studyDay=(S.studyDay===v?'':v); render(); }
  else if(act==='closeStudyDay'){ S.studyDay=''; render(); }
  else if(act==='dayWrong'){ openDayWrong(v); }
  else if(act==='restudy'){ stopTts(); var uu=t.getAttribute('data-u'); startUnitQuiz(v, uu); }
  else if(act==='openVocab'){ S.screen={type:'vocab'}; render(); }
  else if(act==='readConcept'){ readConcept(); }
  else if(act==='stopTts'){ stopTts(); }
  else if(act==='enRate'){ S.enRate=parseFloat(v)||1.0; render(); speakEnglishNow(); }
  else if(act==='speakEng'){ speakEnglishNow(); }
  else if(act==='startVocabMission'){ startVocabMission(); }
  else if(act==='startVocabQuiz'){ startVocabQuiz(); }
  else if(act==='startMission'){ startMission(v); }
  else if(act==='delGallery'){ delGalleryPhoto(v); }
  else if(act==='vqPick'){ vqPick(parseInt(v,10)); }
  else if(act==='vqNext'){ vqNext(); }
  else if(act==='vocabPrev'){ S.vocabI=Math.max(0,(S.vocabI||0)-1); render(); }
  else if(act==='vocabNext'){ S.vocabI=Math.min(VOCAB.length-1,(S.vocabI||0)+1); render(); }
  else if(act==='sayKor'){ var c=vocabCur(); speak(c.kor.word+'. '+c.kor.def,'ko-KR'); }
  else if(act==='sayEng'){ var c=vocabCur(); speak(c.eng.word,'en-US'); }
  else if(act==='sayIdiom'){ var c=vocabCur(); speak(c.idiom.read+'. '+c.idiom.def,'ko-KR'); }
  else if(act==='sayAll'){ var c=vocabCur(); speakSeq([{t:c.kor.word+'. '+c.kor.def,lang:'ko-KR'},{t:c.eng.word,lang:'en-US'},{t:c.idiom.read+'. '+c.idiom.def,lang:'ko-KR'}]); }
  else if(act==='setGrade'){ S.grade=parseInt(v,10); S.screen=null; S.studyDay=''; render(); }
  else if(act==='calMove'){ calMove(parseInt(v,10)); }
  else if(act==='devNextDay'){ S.devOffset=(S.devOffset||0)+1; rolloverDay(); floatStar('🔧 +1일'); render(); }
  else if(act==='backupExport'){ S.myBackup=exportCode(); floatStar('백업 코드 생성'); render(); }
  else if(act==='backupImport'){ var el=document.getElementById('importCode'); if(el&&importCode(el.value)){ floatStar('복원 완료 ✅'); S.tab='home'; S.screen=null; render(); } else { floatStar('코드 오류 ❌'); } }
  else if(act==='resetAll'){ if(S.confirmReset){ resetSave(); S.booted=false;S.onbStep=0;S.grade=0;S.name='';S.stars=60;S.totalStars=60;S.streak=0;S.todayDone=0;S.solved=0;S.perfect=0;S.perfDone=0;S.asked=0;S.fixed=0;S.subjStats={};S.modeStats={};S.subjSolved={};S.unitsDone={};S.wrong=[];S.seen={};S.gallery=[];S.galMsg='';S.missionDone={};S.fullRewardDate='';S.fullStreakBest=0;S.studiedDates={};S.studyLog={};S.wrongLog={};S.studyDay='';S.lastStudy='';S.dayKey='';S.bonusDate='';S.startDate='';S.courseWeek=0;S.planDone={};S.planCtx=null;S.aiDaily={};S.aiBank={};S.imported={kor:[],mat:[],eng:[],soc:[],sci:[]};S.importMsg='';S.importSource='';S.cloud={kor:[],mat:[],eng:[],soc:[],sci:[]};S.cloudUrl='';S.cloudLastSync='';S.cloudMsg='';S.devOffset=0;S.confirmReset=false;S.myBackup='';S.tab='home';S.myView='wrong';render(); } else { S.confirmReset=true; render(); } }
  else if(act==='backSubject'){ if(v){ S.screen={type:'subject',subject:v}; } else { S.screen=null; } render(); }
  else if(act==='exitToTabs'){ S.screen=null; render(); }
  else if(act==='goHome'){ S.screen=null; S.tab='home'; render(); }
  else if(act==='qPick'){ qPick(parseInt(v,10)); }
  else if(act==='qOX'){ qPickOX(v==='1'); }
  else if(act==='qSubmit'){ qSubmit(t.getAttribute('data-skip')==='1'); }
  else if(act==='qNext'){ qNext(); }
  else if(act==='tutorSend'){ tutorSend(); }
  else if(act==='tutorChip'){ tutorSend(v); }
  else if(act==='myView'){ S.myView=v; render(); }
  else if(act==='buy'){ buy(t.getAttribute('data-slot'),v); }
  else if(act==='toggleSound'){ S.muted=!S.muted; if(!S.muted)sndClick(); render(); }
});
document.addEventListener('input',function(ev){
  if(ev.target && ev.target.id==='nameInput'){ S.name=ev.target.value; }
  if(ev.target && ev.target.id==='importQ'){ S.importText=ev.target.value; }
  if(ev.target && ev.target.id==='importUrl'){ S.importUrl=ev.target.value; }
  if(ev.target && ev.target.id==='cloudUrl'){ S.cloudUrl=ev.target.value; }
  if(ev.target && ev.target.id==='writtenInput'){ S.qWritten=ev.target.value; }
});
document.addEventListener('change',function(ev){
  if(ev.target && ev.target.id==='galInput'){ var f=ev.target.files&&ev.target.files[0]; if(f) addGalleryPhoto(f); }
});
document.addEventListener('keydown',function(ev){
  if(ev.target && ev.target.id==='chatInput' && ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); tutorSend(); }
});

loadState();
S.todayGoal=6;
if(S.grade && ![1,2,3,4,5,6].includes(S.grade)) S.grade=4;
mergeImported();
bankRefreshCloud();
render();
autoCloudSync();
</script>
